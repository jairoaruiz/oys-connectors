# Metadata en formato clasico, ADEMAS de la de `pyproject.toml`.
#
# Por que existe este archivo, si pyproject ya declara `[project]`:
# DANTE corre Ubuntu 22.04 con **pip 22.0.2**. Ese pip no lee bien la metadata
# que produce setuptools moderno via PEP 621, y construye el wheel como
# `UNKNOWN-0.0.0`: el paquete se "instala" con nombre desconocido, version 0.0.0
# y sin dejar el modulo importable. Falla en silencio, que es lo peor que podia
# hacer. Con este archivo, setuptools encuentra el nombre y la version por la
# via clasica, y el paquete queda instalable con pip viejo y con pip nuevo.
#
# La alternativa era actualizar pip en DANTE. Se descarto: preferimos que el
# paquete sea instalable en el host tal como esta, y no que el host tenga que
# cambiar para poder instalar el paquete.
#
# SOLO [metadata], y solo name/version. Nada de [options]: si este archivo
# declara `packages = find:` mientras pyproject declara
# `[tool.setuptools.packages.find]`, setuptools intenta aplicar las dos
# configuraciones y revienta con
# `pyprojecttoml.apply_configuration -> AttributeError: 'NoneType' object has no
# attribute 'get'`. El descubrimiento de paquetes se deja en pyproject, que es
# donde vive el resto de la configuracion.
#
# OJO: la version queda en TRES lugares (aca, en pyproject.toml y en
# oys_connectors/__init__.py). No es un descuido — es el precio de soportar los
# dos formatos. `tests/test_empaquetado.py` falla si divergen, asi que no pueden
# desincronizarse en silencio.

[metadata]
name = oys-connectors
version = 0.1.1
